[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consult"
version = "0.1.0"
description = "영세사업자 재무/손익 컨설팅 자동화 시스템 (멀티 에이전트)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "psycopg2-binary>=2.9",
    "SQLAlchemy>=2.0",
    "pydantic>=2.0",
    "jsonschema>=4.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# 연산/에이전트/DB 접근 계층만 패키지로 설치한다.
# schemas/ 는 데이터(JSON), web/ 는 정적 자산이므로 패키지에서 제외.
[tool.setuptools]
packages = ["compute", "db", "agents", "rag", "guards"]

[tool.pytest.ini_options]
testpaths = ["tests"]
