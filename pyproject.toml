[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consult"
version = "0.1.0"
description = "영세사업자 재무/손익 컨설팅 자동화 시스템 (멀티 에이전트)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "psycopg2-binary>=2.9",
    "SQLAlchemy>=2.0",
    "pydantic>=2.0",
    "jsonschema>=4.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# 지속 학습 RAG 백엔드 — 지연 임포트(코어 설치엔 불필요, ChromaCaseStore 사용 시에만).
rag = [
    "chromadb>=0.5",
]

# 연산/에이전트/DB/웹 접근 계층을 패키지로 설치한다.
# schemas/ 는 데이터(JSON), web/templates·static 은 정적 자산(패키지 데이터).
[tool.setuptools]
packages = ["compute", "db", "agents", "rag", "guards", "web", "web.api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
